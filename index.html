<!DOCTYPE html>
<html lang="en">
<head>
<script>
  // Runs before Vue mounts so there's no flash of the wrong theme while the bundle loads.
  // useTheme() reads the attribute this sets, rather than re-deriving it, to stay in sync with this.
  (function () {
    var stored = localStorage.getItem('theme');
    var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  })();
</script>
